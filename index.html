<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Dog Walking Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff7ec, #eef4ff, #ecfff3);
      color: #222;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      text-align: center;
      margin: 4px 0;
      font-size: 30px;
      color: #26324d;
    }

    .panel {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .summary {
      background: #eef4ff;
      border-left: 6px solid #4d7cff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .section { margin-bottom: 15px; }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      background: #edf1fb;
      color: #222;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    button:hover { background: #dfe8ff; }

    button.selected {
      background: #376cf0;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .dog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dog-card {
      border-radius: 18px;
      padding: 14px;
      background: #f9fbff;
      border: 1px solid #dde6f7;
    }

    .dog-card.active {
      border: 2px solid #376cf0;
      background: #eef4ff;
    }

    .dog-card h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    input[type="time"] {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #bbb;
      font-size: 16px;
      width: 180px;
    }

    .save-btn {
      flex: 1 1 220px;
      background: #1e9f58;
      color: white;
      font-weight: bold;
      font-size: 18px;
      border-radius: 14px;
      padding: 14px;
    }

    .clear-btn {
      flex: 1 1 150px;
      background: #f2b94b;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: #f6f7fb;
      color: #444;
      font-size: 14px;
    }

    .records-title {
      margin: 0 0 12px;
      font-size: 24px;
      color: #222;
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record-card {
      border: 1px solid #e3e8f2;
      border-radius: 16px;
      background: #fbfcff;
      padding: 12px;
    }

    .record-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      margin-bottom: 10px;
    }

    .record-main {
      font-weight: 800;
      font-size: 16px;
      line-height: 1.35;
    }

    .record-time {
      font-size: 15px;
      font-weight: 800;
      background: #eef4ff;
      color: #244bc7;
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .record-details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .mini-box {
      background: #f3f5fa;
      border-radius: 12px;
      padding: 8px;
      min-width: 0;
    }

    .mini-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .mini-value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      word-break: break-word;
    }

    .yes { color: #138a42; }
    .no { color: #c92a2a; }
    .dash { color: #777; }

    .empty {
      text-align: center;
      padding: 24px;
      color: #777;
    }

    @media (max-width: 760px) {
      .app { padding: 10px; }
      h1 { font-size: 23px; }
      .dog-grid { grid-template-columns: 1fr; }
      .panel { padding: 14px; border-radius: 22px; }
      button { font-size: 14px; padding: 9px 12px; }
      .records-title { font-size: 22px; }
      .record-details { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .mini-box { padding: 7px 5px; }
      .mini-label { font-size: 10px; }
      .mini-value { font-size: 12px; }
      .record-main { font-size: 15px; }
      .record-time { font-size: 13px; padding: 6px 8px; }
    }

    @media (max-width: 390px) {
      .record-details { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🐾 Family Dog Walking Tracker</h1>

    <div class="panel">
      <div class="summary" id="summary">Select walk details below.</div>

      <div class="section">
        <div class="section-title">1. Who walked?</div>
        <div class="buttons" id="walkerButtons"></div>
      </div>

      <div class="section">
        <div class="section-title">2. Time walked</div>
        <div class="buttons">
          <input type="time" id="timeInput" onchange="setTime(this.value)" onkeydown="if(event.key==='Enter'){setTime(this.value); this.blur();}" />
          <button onclick="useCurrentTime()">⏰ Use Current Time</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">3. How long?</div>
        <div class="buttons" id="durationButtons"></div>
      </div>

      <div class="section">
        <div class="section-title">4. Select dog(s) and poop status</div>
        <div class="dog-grid">
          <div class="dog-card" id="liangCard">
            <h2>🐕 Liang Liang</h2>
            <div class="section-title">Walked?</div>
            <div class="buttons" id="liangWalkedButtons"></div>
            <br />
            <div class="section-title">Pooped?</div>
            <div class="buttons" id="liangPoopButtons"></div>
          </div>

          <div class="dog-card" id="jingCard">
            <h2>🦮 Jing Jing</h2>
            <div class="section-title">Walked?</div>
            <div class="buttons" id="jingWalkedButtons"></div>
            <br />
            <div class="section-title">Pooped?</div>
            <div class="buttons" id="jingPoopButtons"></div>
          </div>
        </div>
      </div>

      <div class="buttons">
        <button class="save-btn" onclick="saveWalk()">Save Walk</button>
        <button class="clear-btn" onclick="clearForm()">Clear Selection</button>
      </div>

      <div class="status" id="status">Ready.</div>
    </div>

    <div class="panel">
      <h2 class="records-title">Family Records — Last 2 Days</h2>
      <div id="recordList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      limit,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCn2h_SEwcIHVHYiTbScvcpmU7waIXfrnc",
      authDomain: "dog-walking-tracker-67ece.firebaseapp.com",
      projectId: "dog-walking-tracker-67ece",
      storageBucket: "dog-walking-tracker-67ece.firebasestorage.app",
      messagingSenderId: "620019383368",
      appId: "1:620019383368:web:a2d499575011464f08ec7d",
      measurementId: "G-PKCWFB067V"
    };

    const APP_VERSION = "compact-records-final-1";
    const walkers = ["Mum", "Dad", "ex-Dad", "Aidan", "Megan"];
    const durations = [5, 10, 15, 20, 25, 30];
    const yesNo = ["Yes", "No"];

    let db = null;
    let records = [];
    let firebaseReady = false;

    let form = {
      walker: "",
      time: "",
      minutes: "",
      liangSelected: false,
      liangPooped: "",
      jingSelected: false,
      jingPooped: ""
    };

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function initFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        firebaseReady = true;
        setStatus("Live sync active. Records updated.");
        listenToRecords();
      } catch (error) {
        firebaseReady = false;
        setStatus("Firebase error: " + error.message);
      }
    }

    function makeChoiceButtons(containerId, options, key, formatter = x => x, disabled = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = formatter(option);
        btn.disabled = disabled;
        btn.className = form[key] === option ? "selected" : "";
        btn.onclick = () => {
          if (disabled) return;
          form[key] = option;
          render();
        };
        container.appendChild(btn);
      });
    }

    function makeBooleanButtons(containerId, key) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      [true, false].forEach(value => {
        const btn = document.createElement("button");
        btn.textContent = value ? "✅ Yes" : "❌ No";
        btn.className = form[key] === value ? "selected" : "";
        btn.onclick = () => {
          form[key] = value;
          if (!value) {
            if (key === "liangSelected") form.liangPooped = "";
            if (key === "jingSelected") form.jingPooped = "";
          }
          render();
        };
        container.appendChild(btn);
      });
    }

    window.setTime = function(value) {
      form.time = value;
      render();
    };

    window.useCurrentTime = function() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      form.time = `${hh}:${mm}`;
      render();
    };

    function selectedDogs() {
      const dogs = [];
      if (form.liangSelected) dogs.push("Liang Liang");
      if (form.jingSelected) dogs.push("Jing Jing");
      return dogs.length ? dogs.join(" + ") : "-";
    }

    function renderSummary() {
      document.getElementById("summary").innerHTML = `
        <strong>Current Selection</strong><br />
        Walker: ${form.walker || "-"} | 
        Time: ${form.time || "-"} | 
        Duration: ${form.minutes ? form.minutes + " min" : "-"}<br />
        Dog(s): ${selectedDogs()}<br />
        Liang Liang Pooped: ${form.liangSelected ? (form.liangPooped || "-") : "Not walked"} | 
        Jing Jing Pooped: ${form.jingSelected ? (form.jingPooped || "-") : "Not walked"}
      `;
    }

    function validateForm() {
      if (!form.walker || !form.time || !form.minutes) {
        alert("Please select walker, time and duration.");
        return false;
      }
      if (!form.liangSelected && !form.jingSelected) {
        alert("Please select at least one dog.");
        return false;
      }
      if (form.liangSelected && !form.liangPooped) {
        alert("Please indicate whether Liang Liang pooped.");
        return false;
      }
      if (form.jingSelected && !form.jingPooped) {
        alert("Please indicate whether Jing Jing pooped.");
        return false;
      }
      return true;
    }

    function buildRecord() {
      const now = new Date();

      return {
        date: now.toLocaleDateString("en-SG"),
        savedAt: now.toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" }),
        walker: form.walker,
        time: form.time,
        minutes: String(form.minutes),
        liangSelected: form.liangSelected,
        liangPooped: form.liangPooped,
        jingSelected: form.jingSelected,
        jingPooped: form.jingPooped,
        createdAt: serverTimestamp()
      };
    }

    async function saveRecord(record) {
      if (!firebaseReady || !db) {
        setStatus("Firebase is not ready. Check Firebase rules.");
        return;
      }

      try {
        await addDoc(collection(db, "dogWalks"), record);
        setStatus("Saved. All family devices should sync.");
      } catch (error) {
        setStatus("Save failed: " + error.message);
      }
    }

    window.saveWalk = async function() {
      if (!validateForm()) return;
      const record = buildRecord();
      await saveRecord(record);
      clearForm(false);
      render();
    };

    function listenToRecords() {
      const q = query(collection(db, "dogWalks"), orderBy("createdAt", "desc"), limit(50));

      onSnapshot(q, snapshot => {
        records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderRecords();
        setStatus("Live sync active. Records updated.");
      }, error => {
        setStatus("Live sync failed: " + error.message);
      });
    }

    window.clearForm = function(shouldRender = true) {
      form = {
        walker: "",
        time: "",
        minutes: "",
        liangSelected: false,
        liangPooped: "",
        jingSelected: false,
        jingPooped: ""
      };
      if (shouldRender) render();
    };

    function dogWasWalked(r, dog) {
      if (dog === "Liang Liang") return r.liangSelected === true || r.liangSelected === "TRUE";
      if (dog === "Jing Jing") return r.jingSelected === true || r.jingSelected === "TRUE";
      return false;
    }

    function dogText(r) {
      const dogs = [];
      if (dogWasWalked(r, "Liang Liang")) dogs.push("Liang Liang");
      if (dogWasWalked(r, "Jing Jing")) dogs.push("Jing Jing");
      return dogs.join(" + ") || "-";
    }

    function statusText(value) {
      if (value === "Yes") return `<span class="yes">✅ Yes</span>`;
      if (value === "No") return `<span class="no">❌ No</span>`;
      return `<span class="dash">—</span>`;
    }

    function walkedText(r, dog) {
      return dogWasWalked(r, dog)
        ? `<span class="yes">✅ Yes</span>`
        : `<span class="no">❌ No</span>`;
    }

    function poopText(r, dog) {
      if (!dogWasWalked(r, dog)) return `<span class="dash">—</span>`;
      const value = dog === "Liang Liang" ? r.liangPooped : r.jingPooped;
      return statusText(value);
    }

    function isLastTwoDays(r) {
      if (!r.date) return false;
      const parts = String(r.date).split("/");
      if (parts.length !== 3) return true;
      const d = new Date(parts[2], parts[1] - 1, parts[0]);
      d.setHours(0, 0, 0, 0);
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 1);
      cutoff.setHours(0, 0, 0, 0);
      return d >= cutoff;
    }

    function renderRecords() {
      const list = document.getElementById("recordList");
      const recent = records.filter(isLastTwoDays);

      if (recent.length === 0) {
        list.innerHTML = `<div class="empty">No shared records from the last 2 days.</div>`;
        return;
      }

      list.innerHTML = `
        <div class="record-list">
          ${recent.map(r => `
            <div class="record-card">
              <div class="record-top">
                <div class="record-main">
                  <div style="font-size:13px;color:#888;font-weight:600;margin-bottom:4px;">
                    📅 ${r.date || "-"}
                  </div>
                  <div style="font-weight:800;font-size:16px;line-height:1.3;">
                    ${r.walker || "-"} · ${r.minutes || "-"} min
                  </div>
                  <div style="font-weight:600;color:#64748b;margin-top:2px;">
                    ${dogText(r)}
                  </div>
                </div>
                <div class="record-time">${r.time || "-"}</div>
              </div>

              <div class="record-details">
                <div class="mini-box">
                  <div class="mini-label">Liang Walk</div>
                  <div class="mini-value">${walkedText(r, "Liang Liang")}</div>
                </div>
                <div class="mini-box">
                  <div class="mini-label">Liang Poop</div>
                  <div class="mini-value">${poopText(r, "Liang Liang")}</div>
                </div>
                <div class="mini-box">
                  <div class="mini-label">Jing Walk</div>
                  <div class="mini-value">${walkedText(r, "Jing Jing")}</div>
                </div>
                <div class="mini-box">
                  <div class="mini-label">Jing Poop</div>
                  <div class="mini-value">${poopText(r, "Jing Jing")}</div>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function render() {
      makeChoiceButtons("walkerButtons", walkers, "walker");
      makeChoiceButtons("durationButtons", durations, "minutes", x => `${x} min`);
      makeBooleanButtons("liangWalkedButtons", "liangSelected");
      makeBooleanButtons("jingWalkedButtons", "jingSelected");
      makeChoiceButtons("liangPoopButtons", yesNo, "liangPooped", x => x === "Yes" ? "✅ Yes" : "❌ No", !form.liangSelected);
      makeChoiceButtons("jingPoopButtons", yesNo, "jingPooped", x => x === "Yes" ? "✅ Yes" : "❌ No", !form.jingSelected);

      document.getElementById("timeInput").value = form.time;
      document.getElementById("liangCard").className = form.liangSelected ? "dog-card active" : "dog-card";
      document.getElementById("jingCard").className = form.jingSelected ? "dog-card active" : "dog-card";
      renderSummary();
      renderRecords();
    }

    render();
    setStatus("Starting Firebase... Version: " + APP_VERSION);
    initFirebase();
  </script>
</body>
</html>
