<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Dog Walking Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #fff7f0 0%, #f4f7ff 45%, #eefaf4 100%);
      color: #222;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      color: #2b2f42;
      letter-spacing: -0.5px;
    }

    .top, .bottom {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(31, 41, 55, 0.12);
      padding: 22px;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .top, .bottom {
      flex: 1;
      overflow-y: auto;
    }

    .section {
      margin-bottom: 14px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #eef2ff, #f4f7ff);
      color: #222;
      transition: all 0.22s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      background: linear-gradient(135deg, #dfe8ff, #edf4ff);
      box-shadow: 0 8px 18px rgba(47,111,237,0.16);
    }

    button.selected {
      background: linear-gradient(135deg, #4f7cff, #2459e0);
      color: white;
      font-weight: bold;
    }

    .dog-panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .dog-card {
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(244,248,255,0.88));
      box-shadow: 0 10px 24px rgba(31,41,55,0.08);
    }

    .dog-card h2 {
      margin: 0 0 14px;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dog-card.active {
      border: 2px solid #4f7cff;
      background: linear-gradient(180deg, #eef4ff, #f8fbff);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(79,124,255,0.18);
    }

    .save-btn {
      flex: 1 1 260px;
      border-radius: 14px;
      background: linear-gradient(135deg, #27c46a, #169c52);
      color: white;
      font-weight: bold;
      font-size: 18px;
      padding: 14px;
    }

    .save-btn:hover {
      background: #168244;
    }

    .clear-btn {
      flex: 1 1 180px;
      background: #f1b44c;
      color: #222;
      font-weight: bold;
    }

    .reset-btn {
      flex: 1 1 180px;
      background: #e24a4a;
      color: white;
      font-weight: bold;
    }

    .summary-box {
      background: linear-gradient(135deg, #eef4ff, #f6fbff);
      border-left: 6px solid #4f7cff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    input[type="time"] {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      width: 220px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f0f2f7;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 24px;
    }

    

    .delete-small {
      background: #eee;
      color: #555;
      padding: 6px 10px;
      font-size: 12px;
    }

    .daily-summary {
      display: none;
    }

    @media (max-width: 800px) {
      .dog-panels {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .app {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
      }

      button {
        font-size: 14px;
        padding: 9px 12px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 7px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🐾 Family Dog Walking Tracker</h1>

    <div class="top">
      <div class="summary-box" id="currentSelection">Select the walk details below.</div>

      <div class="section">
        <div class="section-title">1. Who walked?</div>
        <div class="button-grid" id="walkerButtons"></div>
      </div>

      <div class="section">
        <div class="section-title">2. Time walked</div>
        <input 
          type="time" 
          id="timeInput" 
          onchange="updateTime(this.value)"
          onkeypress="if(event.key==='Enter'){event.preventDefault(); updateTime(this.value); document.getElementById('minuteButtons').scrollIntoView({behavior:'smooth', block:'center'});}"
          style="width:280px;"
        />
      </div>

      <div class="section">
        <div class="section-title">3. How long?</div>
        <div class="button-grid" id="minuteButtons"></div>
      </div>

      <div class="section">
        <div class="section-title">4. Dog</div>
        <p style="margin-top:0; color:#666;">Select one or both dogs.</p>
      </div>

      <div class="dog-panels">
        <div class="dog-card" id="liangCard">
          <h2>🐕 Liang Liang</h2>
          <div class="section">
            <div class="section-title">Selected?</div>
            <div class="button-grid" id="liangSelectedButtons"></div>
          </div>
          <div class="section">
            <div class="section-title">Pooped?</div>
            <div class="button-grid" id="liangPoopButtons"></div>
          </div>
        </div>

        <div class="dog-card" id="jingCard">
          <h2>🦮 Jing Jing</h2>
          <div class="section">
            <div class="section-title">Selected?</div>
            <div class="button-grid" id="jingSelectedButtons"></div>
          </div>
          <div class="section">
            <div class="section-title">Pooped?</div>
            <div class="button-grid" id="jingPoopButtons"></div>
          </div>
        </div>
      </div>

      <div class="button-grid">
        <button class="save-btn" onclick="saveWalk()">Save Walk</button>
        <button class="clear-btn" onclick="clearSelection()">Clear Selection</button>
        <button class="reset-btn" onclick="resetAll()">Reset All Records</button>
      </div>
    </div>

    <div class="bottom">
      
      <h2 style="margin-top:0;">Walk Records</h2>
      <div id="recordList"></div>
    </div>
  </div>

  <script>
    // =========================
    // GOOGLE SHEETS DATABASE
    // =========================
    // 1. Create a Google Sheet
    // 2. Open Extensions → Apps Script
    // 3. Paste the Apps Script code below
    // 4. Deploy as Web App
    // 5. Replace YOUR_GOOGLE_SCRIPT_URL below

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdbghdGNu4F9LlnBnUT5p1xMPc6N6czM022rtARJTh0puIkBcAvTFrKEriRExLrOi90g/exec";
    const walkers = ["Mum", "ex-Dad", "Aidan", "Megan"];
    const minutes = [5, 10, 15, 20, 25, 30];
    const yesNo = ["Yes", "No"];

    let selection = {
      walker: "",
      time: "",
      minutes: "",
      liangSelected: false,
      jingSelected: false,
      liangPooped: "",
      jingPooped: ""
    };

    let records = JSON.parse(localStorage.getItem("dogWalkRecords")) || [];

    function makeButtons(containerId, items, key, labelFn = x => x, disabled = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      items.forEach(item => {
        const btn = document.createElement("button");
        btn.textContent = labelFn(item);
        btn.className = selection[key] === item ? "selected" : "";
        btn.disabled = disabled;
        if (disabled) {
          btn.style.opacity = "0.45";
          btn.style.cursor = "not-allowed";
        }
        btn.onclick = () => {
          if (disabled) return;
          selection[key] = item;
          renderAll();
    loadFromGoogleSheets();
        };
        container.appendChild(btn);
      });
    }

    function makeToggleButtons(containerId, key) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      [true, false].forEach(value => {
        const btn = document.createElement("button");
        btn.textContent = value ? "✅ Yes" : "❌ No";
        btn.className = selection[key] === value ? "selected" : "";
        btn.onclick = () => {
          selection[key] = value;
          if (!value) {
            if (key === "liangSelected") selection.liangPooped = "";
            if (key === "jingSelected") selection.jingPooped = "";
          }
          renderAll();
        };
        container.appendChild(btn);
      });
    }

    function updateTime(value) {
      selection.time = value;
      renderAll();
    }

    function selectedDogsText() {
      const dogs = [];
      if (selection.liangSelected) dogs.push("Liang Liang");
      if (selection.jingSelected) dogs.push("Jing Jing");
      return dogs.length ? dogs.join(" + ") : "-";
    }

    function renderSelection() {
      const box = document.getElementById("currentSelection");
      box.innerHTML = `
        <strong>Current Selection</strong><br>
        Dog(s): ${selectedDogsText()} | 
        Walker: ${selection.walker || "-"} | 
        Time: ${selection.time || "-"} | 
        Duration: ${selection.minutes ? selection.minutes + " min" : "-"} | 
        Liang Liang Pooped: ${selection.liangSelected ? (selection.liangPooped || "-") : "Not walked"} | 
        Jing Jing Pooped: ${selection.jingSelected ? (selection.jingPooped || "-") : "Not walked"}
      `;
    }

    function saveWalk() {
      if (!selection.walker || !selection.time || !selection.minutes) {
        alert("Please select walker, time and duration before saving.");
        return;
      }

      if (!selection.liangSelected && !selection.jingSelected) {
        alert("Please select at least one dog.");
        return;
      }

      if (selection.liangSelected && !selection.liangPooped) {
        alert("Please indicate whether Liang Liang pooped.");
        return;
      }

      if (selection.jingSelected && !selection.jingPooped) {
        alert("Please indicate whether Jing Jing pooped.");
        return;
      }

      const now = new Date();
      const record = {
        id: Date.now(),
        date: now.toLocaleDateString("en-SG"),
        savedAt: now.toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" }),
        ...selection
      };

      records.unshift(record);
      localStorage.setItem("dogWalkRecords", JSON.stringify(records));

      // Save to Google Sheets
      saveToGoogleSheets(record);
      clearSelection(false);
      renderAll();
    }

    async function saveToGoogleSheets(record) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL") {
        return;
      }

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(record)
        });
      } catch (error) {
        console.error("Google Sheets save error:", error);
      }
    }

    async function loadFromGoogleSheets() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL") {
        return;
      }

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const data = await response.json();

        if (Array.isArray(data)) {
          records = data.reverse();
          localStorage.setItem("dogWalkRecords", JSON.stringify(records));
          renderRecords();
        }
      } catch (error) {
        console.error("Google Sheets load error:", error);
      }
    }

    function clearSelection(shouldRender = true) {
      selection = {
        walker: "",
        time: "",
        minutes: "",
        liangSelected: false,
        jingSelected: false,
        liangPooped: "",
        jingPooped: ""
      };
      if (shouldRender) renderAll();
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      localStorage.setItem("dogWalkRecords", JSON.stringify(records));
      renderAll();
    }

    function resetAll() {
      if (confirm("Delete all walk records?")) {
        records = [];
        localStorage.removeItem("dogWalkRecords");
        renderAll();
      }
    }

    function recordDogsText(r) {
      const dogs = [];
      if (r.liangSelected || r.dog === "Liang Liang" || r.dog === "Liang Liang + Jing Jing") dogs.push("Liang Liang");
      if (r.jingSelected || r.dog === "Jing Jing" || r.dog === "Liang Liang + Jing Jing") dogs.push("Jing Jing");
      return dogs.length ? dogs.join(" + ") : "-";
    }

    function dogWasWalked(r, dogName) {
      if (dogName === "Liang Liang") return r.liangSelected || r.dog === "Liang Liang" || r.dog === "Liang Liang + Jing Jing";
      if (dogName === "Jing Jing") return r.jingSelected || r.dog === "Jing Jing" || r.dog === "Liang Liang + Jing Jing";
      return false;
    }

    function poopText(r, dogName) {
      if (!dogWasWalked(r, dogName)) return "-";
      const value = dogName === "Liang Liang" ? (r.liangPooped || r.pooped) : (r.jingPooped || r.pooped);
      return value === "Yes" ? "✅ Yes" : "❌ No";
    }

    function renderRecords() {
      const list = document.getElementById("recordList");

      if (records.length === 0) {
        list.innerHTML = `<div class="empty">No walks recorded yet.</div>`;
        return;
      }

      list.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Dog(s)</th>
              <th>Time</th>
              <th>Walker</th>
              <th>Minutes</th>
              <th>Liang Liang Pooped</th>
              <th>Jing Jing Pooped</th>
              <th>Saved</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${records.map(r => `
              <tr>
                <td>${r.date}</td>
                <td>${recordDogsText(r)}</td>
                <td>${r.time}</td>
                <td>${r.walker}</td>
                <td>${r.minutes} min</td>
                <td>${poopText(r, "Liang Liang")}</td>
                <td>${poopText(r, "Jing Jing")}</td>
                <td>${r.savedAt}</td>
                <td><button class="delete-small" onclick="deleteRecord(${r.id})">Delete</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderAll() {
      makeButtons("walkerButtons", walkers, "walker");
      document.getElementById("timeInput").value = selection.time;
      makeButtons("minuteButtons", minutes, "minutes", m => `${m} min`);
      makeToggleButtons("liangSelectedButtons", "liangSelected");
      makeToggleButtons("jingSelectedButtons", "jingSelected");
      makeButtons("liangPoopButtons", yesNo, "liangPooped", p => p === "Yes" ? "✅ Yes" : "❌ No", !selection.liangSelected);
      makeButtons("jingPoopButtons", yesNo, "jingPooped", p => p === "Yes" ? "✅ Yes" : "❌ No", !selection.jingSelected);

      document.getElementById("liangCard").className = selection.liangSelected ? "dog-card active" : "dog-card";
      document.getElementById("jingCard").className = selection.jingSelected ? "dog-card active" : "dog-card";

      renderSelection();
      renderRecords();
    }

    renderAll();
  </script>
</body>
</html>
