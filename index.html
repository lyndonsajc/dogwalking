<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Dog Walking Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff7ec, #eef4ff, #ecfff3);
      color: #222;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      text-align: center;
      margin: 4px 0;
      font-size: 30px;
      color: #26324d;
    }

    .panel {
      background: rgba(255,255,255,0.88);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.10);
    }

    .top {
      flex: 1;
      overflow-y: auto;
    }

    .bottom {
      flex: 1;
      overflow-y: auto;
    }

    .summary {
      background: #eef4ff;
      border-left: 6px solid #4d7cff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .section {
      margin-bottom: 15px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      background: #edf1fb;
      color: #222;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    button:hover {
      background: #dfe8ff;
    }

    button.selected {
      background: #376cf0;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .dog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dog-card {
      border-radius: 18px;
      padding: 14px;
      background: #f9fbff;
      border: 1px solid #dde6f7;
    }

    .dog-card.active {
      border: 2px solid #376cf0;
      background: #eef4ff;
    }

    .dog-card h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    input[type="time"] {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #bbb;
      font-size: 16px;
      width: 180px;
    }

    .save-btn {
      flex: 1 1 220px;
      background: #1e9f58;
      color: white;
      font-weight: bold;
      font-size: 18px;
      border-radius: 14px;
      padding: 14px;
    }

    .clear-btn {
      flex: 1 1 150px;
      background: #f2b94b;
      font-weight: bold;
    }

    .refresh-btn {
      flex: 1 1 150px;
      background: #6d7df0;
      color: white;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: #f6f7fb;
      color: #444;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f0f2f7;
      position: sticky;
      top: 0;
    }

    .empty {
      text-align: center;
      padding: 24px;
      color: #777;
    }

    @media (max-width: 760px) {
      h1 {
        font-size: 23px;
      }

      .dog-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 14px;
      }

      button {
        font-size: 14px;
        padding: 9px 12px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 7px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🐾 Family Dog Walking Tracker</h1>

    <div class="panel top">
      <div class="summary" id="summary">Select walk details below.</div>

      <div class="section">
        <div class="section-title">1. Who walked?</div>
        <div class="buttons" id="walkerButtons"></div>
      </div>

      <div class="section">
        <div class="section-title">2. Time walked</div>
        <div class="buttons">
          <input type="time" id="timeInput" onchange="setTime(this.value)" onkeydown="if(event.key==='Enter'){setTime(this.value); this.blur();}" />
          <button onclick="useCurrentTime()">⏰ Use Current Time</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">3. How long?</div>
        <div class="buttons" id="durationButtons"></div>
      </div>

      <div class="section">
        <div class="section-title">4. Select dog(s) and poop status</div>
        <div class="dog-grid">
          <div class="dog-card" id="liangCard">
            <h2>🐕 Liang Liang</h2>
            <div class="section-title">Walked?</div>
            <div class="buttons" id="liangWalkedButtons"></div>
            <br>
            <div class="section-title">Pooped?</div>
            <div class="buttons" id="liangPoopButtons"></div>
          </div>

          <div class="dog-card" id="jingCard">
            <h2>🦮 Jing Jing</h2>
            <div class="section-title">Walked?</div>
            <div class="buttons" id="jingWalkedButtons"></div>
            <br>
            <div class="section-title">Pooped?</div>
            <div class="buttons" id="jingPoopButtons"></div>
          </div>
        </div>
      </div>

      <div class="buttons">
        <button class="save-btn" onclick="saveWalk()">Save Walk</button>
        <button class="refresh-btn" onclick="loadRecords()">Refresh Records</button>
        <button class="refresh-btn" onclick="testPhoneSync()">Test Sync</button>
        <button class="clear-btn" onclick="clearForm()">Clear Selection</button>
      </div>

      <div class="status" id="status">Ready.</div>
    </div>

    <div class="panel bottom">
      <h2 style="margin-top:0;">Walk Records — Last 2 Days</h2>
      <div id="recordList"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzitloAJgE4kcWrsVBK_U46uXG0yFdvir1HjZnIZAMaXPyW6KQFuiChzFXntymcVw1NPQ/exec";
    const APP_VERSION = "mobile-beacon-save-1";

    const walkers = ["Mum", "ex-Dad", "Aidan", "Megan"];
    const durations = [5, 10, 15, 20, 25, 30];
    const yesNo = ["Yes", "No"];

    let form = {
      walker: "",
      time: "",
      minutes: "",
      liangSelected: false,
      liangPooped: "",
      jingSelected: false,
      jingPooped: ""
    };

    let records = [];

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function makeChoiceButtons(containerId, options, key, formatter = x => x, disabled = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = formatter(option);
        btn.disabled = disabled;
        btn.className = form[key] === option ? "selected" : "";
        btn.onclick = () => {
          if (disabled) return;
          form[key] = option;
          render();
        };
        container.appendChild(btn);
      });
    }

    function makeBooleanButtons(containerId, key) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      [true, false].forEach(value => {
        const btn = document.createElement("button");
        btn.textContent = value ? "✅ Yes" : "❌ No";
        btn.className = form[key] === value ? "selected" : "";
        btn.onclick = () => {
          form[key] = value;
          if (!value) {
            if (key === "liangSelected") form.liangPooped = "";
            if (key === "jingSelected") form.jingPooped = "";
          }
          render();
        };
        container.appendChild(btn);
      });
    }

    function setTime(value) {
      form.time = value;
      render();
    }

    function useCurrentTime() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      form.time = `${hh}:${mm}`;
      render();
    }

    function selectedDogs() {
      const dogs = [];
      if (form.liangSelected) dogs.push("Liang Liang");
      if (form.jingSelected) dogs.push("Jing Jing");
      return dogs.length ? dogs.join(" + ") : "-";
    }

    function renderSummary() {
      document.getElementById("summary").innerHTML = `
        <strong>Current Selection</strong><br>
        Walker: ${form.walker || "-"} | 
        Time: ${form.time || "-"} | 
        Duration: ${form.minutes ? form.minutes + " min" : "-"}<br>
        Dog(s): ${selectedDogs()}<br>
        Liang Liang Pooped: ${form.liangSelected ? (form.liangPooped || "-") : "Not walked"} | 
        Jing Jing Pooped: ${form.jingSelected ? (form.jingPooped || "-") : "Not walked"}
      `;
    }

    function validateForm() {
      if (!form.walker || !form.time || !form.minutes) {
        alert("Please select walker, time and duration.");
        return false;
      }
      if (!form.liangSelected && !form.jingSelected) {
        alert("Please select at least one dog.");
        return false;
      }
      if (form.liangSelected && !form.liangPooped) {
        alert("Please indicate whether Liang Liang pooped.");
        return false;
      }
      if (form.jingSelected && !form.jingPooped) {
        alert("Please indicate whether Jing Jing pooped.");
        return false;
      }
      return true;
    }

    function saveWalk() {
      if (!validateForm()) return;

      const now = new Date();
      const record = {
        id: String(Date.now()),
        date: now.toLocaleDateString("en-SG"),
        savedAt: now.toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" }),
        walker: form.walker,
        time: form.time,
        minutes: String(form.minutes),
        liangSelected: form.liangSelected ? "TRUE" : "FALSE",
        liangPooped: form.liangPooped,
        jingSelected: form.jingSelected ? "TRUE" : "FALSE",
        jingPooped: form.jingPooped
      };

      records.unshift(record);
      renderRecords();
      clearForm(false);
      render();
      setStatus("Saving to Google Sheet...");
      sendToGoogleSheet(record);
    }

    function testPhoneSync() {
      const now = new Date();
      const testRecord = {
        id: "phone-test-" + Date.now(),
        date: now.toLocaleDateString("en-SG"),
        savedAt: now.toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" }),
        walker: "PHONE TEST",
        time: "TEST",
        minutes: "5",
        liangSelected: "TRUE",
        liangPooped: "Yes",
        jingSelected: "FALSE",
        jingPooped: ""
      };
      setStatus("Testing phone sync... app version: " + APP_VERSION);
      sendToGoogleSheet(testRecord);
    }

    function sendToGoogleSheet(record) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
        setStatus("Google Script URL not set yet.");
        return;
      }

      const params = new URLSearchParams(record);
      params.set("action", "add");
      params.set("cache", Date.now());

      const url = GOOGLE_SCRIPT_URL + "?" + params.toString();

      // Mobile-safe save method. We do not wait for a reply because some phones block callbacks.
      const img = new Image();
      img.src = url;

      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = url;
      document.body.appendChild(iframe);

      setStatus("Save request sent. Check Google Sheet, then tap Refresh Records.");

      setTimeout(() => {
        iframe.remove();
        loadRecords();
      }, 2500);
    }

    function loadRecords() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
        setStatus("Google Script URL not set yet.");
        renderRecords();
        return;
      }

      setStatus("Loading records from Google Sheet...");
      const callbackName = "loadCallback" + Date.now();

      window[callbackName] = function(data) {
        records = Array.isArray(data) ? data.reverse() : [];
        renderRecords();
        setStatus("Records loaded.");
        delete window[callbackName];
        const oldScript = document.getElementById(callbackName);
        if (oldScript) oldScript.remove();
      };

      const script = document.createElement("script");
      script.id = callbackName;
      script.src = GOOGLE_SCRIPT_URL + "?action=list&callback=" + callbackName + "&cache=" + Date.now();
      script.onerror = function() {
        setStatus("Cannot load records from Google Script on this device.");
      };
      document.body.appendChild(script);
    }

    function clearForm(shouldRender = true) {
      form = {
        walker: "",
        time: "",
        minutes: "",
        liangSelected: false,
        liangPooped: "",
        jingSelected: false,
        jingPooped: ""
      };
      if (shouldRender) render();
    }

    function dogWasWalked(r, dog) {
      if (dog === "Liang Liang") return r.liangSelected === true || r.liangSelected === "TRUE";
      if (dog === "Jing Jing") return r.jingSelected === true || r.jingSelected === "TRUE";
      return false;
    }

    function dogText(r) {
      const dogs = [];
      if (dogWasWalked(r, "Liang Liang")) dogs.push("Liang Liang");
      if (dogWasWalked(r, "Jing Jing")) dogs.push("Jing Jing");
      return dogs.join(" + ") || "-";
    }

    function poopText(r, dog) {
      if (!dogWasWalked(r, dog)) return "-";
      const value = dog === "Liang Liang" ? r.liangPooped : r.jingPooped;
      return value === "Yes" ? "✅ Yes" : "❌ No";
    }

    function isLastTwoDays(r) {
      if (!r.date) return false;
      const parts = String(r.date).split("/");
      if (parts.length !== 3) return true;
      const d = new Date(parts[2], parts[1] - 1, parts[0]);
      d.setHours(0, 0, 0, 0);
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 1);
      cutoff.setHours(0, 0, 0, 0);
      return d >= cutoff;
    }

    function renderRecords() {
      const list = document.getElementById("recordList");
      const recent = records.filter(isLastTwoDays);

      if (recent.length === 0) {
        list.innerHTML = `<div class="empty">No records from the last 2 days.</div>`;
        return;
      }

      list.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Dog(s)</th>
              <th>Time</th>
              <th>Walker</th>
              <th>Minutes</th>
              <th>Liang Liang Pooped</th>
              <th>Jing Jing Pooped</th>
              <th>Saved At</th>
            </tr>
          </thead>
          <tbody>
            ${recent.map(r => `
              <tr>
                <td>${r.date || ""}</td>
                <td>${dogText(r)}</td>
                <td>${r.time || ""}</td>
                <td>${r.walker || ""}</td>
                <td>${r.minutes || ""} min</td>
                <td>${poopText(r, "Liang Liang")}</td>
                <td>${poopText(r, "Jing Jing")}</td>
                <td>${r.savedAt || ""}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function render() {
      makeChoiceButtons("walkerButtons", walkers, "walker");
      makeChoiceButtons("durationButtons", durations, "minutes", x => `${x} min`);
      makeBooleanButtons("liangWalkedButtons", "liangSelected");
      makeBooleanButtons("jingWalkedButtons", "jingSelected");
      makeChoiceButtons("liangPoopButtons", yesNo, "liangPooped", x => x === "Yes" ? "✅ Yes" : "❌ No", !form.liangSelected);
      makeChoiceButtons("jingPoopButtons", yesNo, "jingPooped", x => x === "Yes" ? "✅ Yes" : "❌ No", !form.jingSelected);

      document.getElementById("timeInput").value = form.time;
      document.getElementById("liangCard").className = form.liangSelected ? "dog-card active" : "dog-card";
      document.getElementById("jingCard").className = form.jingSelected ? "dog-card active" : "dog-card";
      renderSummary();
      renderRecords();
    }

    render();
    setStatus("Ready. Version: " + APP_VERSION);
    loadRecords();
  </script>
</body>
</html>
